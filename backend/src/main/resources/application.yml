server:
  port: 8080

spring:
  application:
    name: student-management-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 数据库凭据通过环境变量注入（DB_USERNAME / DB_PASSWORD），默认值仅用于本地开发
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Redis：多实例共享状态（登录锁定 / OAuth state / 限流 / 业务缓存），凭据通过环境变量注入
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    # 命令超时 500ms：Redis 故障时快速失败进入降级，避免登录等路径多次操作累积长延迟
    timeout: 500ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 默认使用 Slf4jImpl 避免把含参数的 SQL 打印到 stdout；开发调试可设 MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      id-type: auto

# Knife4j 接口文档：生产默认关闭（避免接口定义未认证公开），本地开发可设 KNIFE4J_ENABLE=true
knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

# JWT 配置（密钥必须通过环境变量 JWT_SECRET 注入，未设置将拒绝启动，禁止使用默认密钥）
jwt:
  secret: ${JWT_SECRET:}
  # Token 有效期：12 小时
  expire-hours: 12

# GitHub OAuth 登录（密钥通过环境变量注入；未配置时 authorize 接口返回提示，不影响主流程）
oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/oauth/github/callback}

# AI 智能分析服务地址（默认 http://localhost:8000，可用环境变量 AI_BASE_URL 覆盖）
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

# 应用自定义配置
app:
  rate-limit:
    # 是否信任 X-Forwarded-For 作为客户端 IP（默认 false 不信任，防止伪造头绕过限流；
    # 仅当部署在可信反向代理/Nginx 之后时设为 true，由代理写入真实 IP）
    trust-xff: ${TRUST_XFF:false}

# 跨域白名单（逗号分隔的精确源，可用环境变量 CORS_ALLOWED_ORIGINS 覆盖）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.example.sms: ${LOG_LEVEL:info}
